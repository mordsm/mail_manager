# ==============================================================================
# LLM Wiki Knowledge Taxonomy: Main Subjects & Sub-Subjects Configuration
# ==============================================================================
# You can edit this file externally at any time using any text editor or Obsidian.
# Changes are dynamically reloaded by the system and available immediately in the UI.
#
# Structure for each subject:
#   <subject_key>:
#     title: "English Title"
#     title_he: "Hebrew Title"
#     description: "Scope description"
#     folder: "wiki/<domain>"
#     subsubjects:
#       <subsubject_key>:
#         title: "English Sub-Subject Title"
#         title_he: "Hebrew Sub-Subject Title"
#         folder: "wiki/<domain>/optional_subfolder"
#         keywords: ["keyword1", "keyword2", ...]

subjects:
  research:
    title: "Research & Technology"
    title_he: "מחקר וטכנולוגיה"
    description: "Scientific literature, mechanistic biology, medicine, and deep research"
    folder: "wiki/research"
    subsubjects:
      all:
        title: "All Research Sub-Subjects"
        title_he: "🔬 כל תחומי המחקר"
        folder: "wiki/research"
      autoimmune:
        title: "Autoimmune Diseases"
        title_he: "מחלות אוטואימוניות (Sjögren, Lupus, MS)"
        keywords: ["autoimmune", "sjögren", "sjogren", "lupus", "אוטואימוני", "שיוגרן", "זאבת"]
        folder: "wiki/research"
      microbiome_gut:
        title: "Gut Microbiome & Barrier"
        title_he: "מיקרוביום, מחסום מעי ודלקתיות"
        keywords: ["microbiome", "gut", "barrier", "intestinal", "permeability", "מעי", "מיקרוביום", "מחסום מעי", "דלקת"]
        folder: "wiki/research"
      neurodegenerative:
        title: "Neurodegenerative Diseases"
        title_he: "מחלות נוירודגנרטיביות (Parkinson, Alzheimer)"
        keywords: ["parkinson", "alzheimer", "neurodegenerative", "פרקינסון", "אלצהיימר"]
        folder: "wiki/research"
      pharmacology_metabolites:
        title: "Pharmacology & Metabolites (Butyrate, SCFAs)"
        title_he: "פרמקולוגיה ומטבוליטים (בוטיראט, חומצות שומן קצרות)"
        keywords: ["butyrate", "scfa", "metabolite", "קטונים", "בוטיראט", "מטבוליטים"]
        folder: "wiki/research"
      oncology:
        title: "Oncology & Cancer Inflammation"
        title_he: "אונקולוגיה ודלקתיות בסרטן"
        keywords: ["cancer", "oncology", "tumor", "סרטן", "אונקולוגיה"]
        folder: "wiki/research"
      books_inner_gate:
        title: "Books & Monographs (The Inner Gate)"
        title_he: "ספרים ומונוגרפיות (השער הפנימי)"
        keywords: ["inner_gate", "שער פנימי", "ספר"]
        folder: "wiki/research/books"

