<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 280px;
      padding: 14px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #1e293b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dot {
      height: 8px;
      width: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>🧠 LLM Wiki Auto-Capture</h2>
  <div class="status">
    <span><span class="dot"></span> Connected to Vault</span>
    <strong id="count">0</strong>
  </div>
  <button id="captureBtn">📌 Capture Current Page</button>
  <div class="footer">Zero-Click Ingestion Active</div>

  <script src="popup.js"></script>
</body>
</html>
