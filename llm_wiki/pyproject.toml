[project]
name = "llm-wiki"
version = "0.1.0"
description = "Local-first, AI-maintained knowledge system based on Obsidian, Markdown, YAML frontmatter, Git, Python, FastAPI, Typer CLI, Watchdog, and LLM abstraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "watchdog>=3.0.0",
    "httpx>=0.26.0",
    "python-frontmatter>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pytest>=7.0.0",
    "python-docx>=1.2.0",
]

[project.scripts]
wiki = "app.cli.main:app"


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

